project:
  type: website
  output-dir: _site

website:
  title: "BAIT — Biotic AI Toolkit"
  description: "Give your AI agent IMR Biotic expertise, with local analysis and source-aware data handling."
  site-url: "https://deepwaterimr.github.io/BAIT/"
  repo-url: "https://github.com/DeepWaterIMR/BAIT"
  favicon: assets/fiskwise-favicon.svg
  navbar:
    logo: assets/fiskwise-wordmark.svg
    background: primary
    left:
      - href: https://deepwaterimr.github.io/fiskwise/
        text: Fiskwise
      - href: index.qmd
        text: BAIT docs
      - href: getting-started.qmd
        text: Getting started
      - href: examples.qmd
        text: Example queries
      - href: privacy.qmd
        text: Privacy
    right:
      - icon: github
        href: https://github.com/DeepWaterIMR/BAIT
  page-footer:
    center: "[Part of Fiskwise](https://deepwaterimr.github.io/fiskwise/) · BAIT · DeepWaterIMR"

format:
  html:
    theme: cosmo
    css:
      - assets/fiskwise-tokens.css
      - assets/fiskwise-quarto.css
    toc: true
    code-copy: true
    code-overflow: wrap

# This site is documentation only; do not execute R against the database.
execute:
  enabled: false
